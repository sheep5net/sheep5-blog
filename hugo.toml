baseURL = "https://sheep5.net/"
defaultContentLanguage = "zh-cn"
title = "Sheep5's Blog"
theme = "PaperMod"
[pagination]
pagerSize = 10

enableRobotsTXT = true
enableEmoji = true

# CJK 语言支持（修复中文字数统计和阅读时间）
hasCJKLanguage = true

# 主内容栏目（影响 RSS、归档、首页列表）
mainSections = ["posts"]

# 固定链接：/posts/随机数字/
[permalinks]
  posts = "/posts/:slug/"

# Hugo 构建配置
[markup]
  [markup.highlight]
    style = "github"
    lineNos = false
    codeFences = true
    guessSyntax = true
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

# PaperMod 核心配置
[params]
  env = "production"
  defaultTheme = "auto"
  ShowReadingTime = true
  titleSeparator = "-"
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = true
  ShowFullTextinRSS = true
  ShowToc = true
  TocOpen = false
  disableThemeToggle = false
  disableSpecial1stPost = true
  hideMeta = false
  hideSummary = false

  # 日期格式（中文）
  DateFormat = "2006年01月02日"

  # SEO 网站描述
  description = "欢迎来到 Sheep5 博客。这是一个记录生活碎碎念、阅读书评与深度思考的地方。我在这里写下关于世界、自我与创造的文字，希望能在这个喧嚣的时代，为你提供一处安静的思考角落。"

  # 作者
  author = "Sheep5"

  # Open Graph 语言（修正 zh_cn -> zh_CN）
  locale = "zh_CN"

  # 社交链接
  [[params.socialIcons]]
    name = "rss"
    url = "/rss.xml"

  # 站点图标
  [params.assets]
    favicon = "favicon.png"
    favicon16x16 = "favicon-16x16.png"
    favicon32x32 = "favicon-32x32.png"
    apple_touch_icon = "apple-touch-icon.png"

  # 社交媒体分享图
  images = ["og-image.jpg"]

  # 搜索
  [params.fuseOpts]
    isCaseSensitive = false
    shouldSort = true
    location = 0
    distance = 1000
    threshold = 0.4
    minMatchCharLength = 0
    keys = ["title", "permalink", "summary", "content"]

# 输出格式（搜索功能需要）
[outputs]
  home = ["HTML", "RSS", "JSON"]

# RSS 输出为 rss.xml
[outputFormats]
  [outputFormats.rss]
    baseName = "rss"

# Sitemap 配置
[sitemap]
  changefreq = "daily"
  priority = 0.5
  filename = "sitemap.xml"

# RSS 配置
[services.rss]
  limit = 5

# 菜单
[[menu.main]]
  identifier = "home"
  name = "首页"
  url = "/"
  weight = 1

[[menu.main]]
  identifier = "archives"
  name = "归档"
  url = "/archives/"
  weight = 2

[[menu.main]]
  identifier = "tags"
  name = "标签"
  url = "/tags/"
  weight = 3

[[menu.main]]
  identifier = "search"
  name = "搜索"
  url = "/search/"
  weight = 4

[[menu.main]]
  identifier = "about"
  name = "关于"
  url = "/about/"
  weight = 5
